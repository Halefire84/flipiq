name: Build & Sign Release AAB

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        run: gradle testDebugUnitTest
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/

      - name: Build release AAB
        run: gradle bundleRelease
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Sign AAB
        uses: r0adkll/sign-android-release@v1
        id: sign
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.FLIPIQ_KEYSTORE_BASE64 }}
          alias: ${{ secrets.FLIPIQ_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.FLIPIQ_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.FLIPIQ_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: flipiq-release-signed
          path: ${{ steps.sign.outputs.signedReleaseFile }}
          retention-days: 30
